name: Telegram Auto Publisher

on:
  push:
    branches:
      - main
  schedule:
    - cron: '40 6 * * *'
    - cron: '42 6 * * *'
    - cron: '45 6 * * *'
    - cron: '2 7 * * *'
    - cron: '5 7 * * *'
    - cron: '10 7 * * *'
  workflow_dispatch:

concurrency:
  group: telegram-auto-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Scheduled Messages
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      TIMEZONE: 'Asia/Dhaka'
      GITHUB_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restore publication state cache
        uses: actions/cache@v4
        with:
          path: data/state.json
          key: publisher-state-${{ github.run_id }}
          restore-keys: |
            publisher-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Publisher
        run: |
          echo "Executing: python main.py"
          python main.py
